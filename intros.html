<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}</style>
<title>2026 연말모임 자기소개</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: header + search, then a masonry of name cards (CSS columns) so short and long introductions pack tightly.
   Single light look by choice, matching the invitation site's cream / navy / sage palette. */
:root{
  --paper:#F8F3E8; --card:#FFFDF8; --ink:#182740; --ink-soft:#4A5568; --line:#E6DDC8;
  --sage:#7A9E68; --sage-soft:#E3EBD6; --butter:#F3E6C4; --peach:#F6D2BE; --sky:#D3E4EE; --rose:#F1D3DA;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html{background:var(--paper)}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-block:40px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:12px;max-width:640px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.14em;color:var(--sage);font-weight:700}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.15;text-wrap:balance}
h1 em{font-style:normal;color:var(--sage)}
.lede{margin:0;color:var(--ink-soft);font-size:16px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{
  width:100%;box-sizing:border-box;font:inherit;font-size:15px;color:var(--ink);
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 18px 10px 42px;
}
.search input:focus-visible{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-soft)}
.count{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.grid{columns:3 300px;column-gap:20px}
.card{
  break-inside:avoid;margin:0 0 20px;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;
}
.who{display:flex;align-items:center;gap:14px}
.photo{display:block;width:100%;max-width:100%;height:auto;border-radius:14px;background:var(--sage-soft)}
.avatar{
  flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:19px;color:var(--ink);
}
.name{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.alias{display:block;font-family:var(--body);font-size:13px;color:var(--ink-soft)}
.intro{margin:0;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.card.long:not(.open) .intro{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.searching .card.long .intro{display:block;-webkit-line-clamp:unset;overflow:visible}
.searching .more{display:none}
.more{
  align-self:flex-start;font:inherit;font-size:14px;color:var(--sage);background:none;border:0;padding:2px 0;cursor:pointer;
  border-bottom:1.5px solid currentColor;
}
.more:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:2px}
.intro a{color:var(--ink);text-decoration-color:var(--sage);text-underline-offset:3px}
mark{background:var(--butter);color:inherit;border-radius:3px;padding:0 1px}
.empty{margin:0;padding:28px;border:1.5px dashed var(--line);border-radius:20px;text-align:center;color:var(--ink-soft)}

.waiting{display:flex;flex-direction:column;gap:12px;padding:22px;background:var(--sage-soft);border-radius:20px}
.waiting h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.waiting p{margin:0;font-size:14px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{background:var(--card);border-radius:999px;padding:4px 14px;font-size:15px}
footer{font-size:13px;color:var(--ink-soft)}
@media (max-width:480px){ .card{padding:18px} .name{font-size:20px} }
</style>
</head>
<body>

<div class="wrap">
  <a href="./" style="align-self:flex-start;font-size:14px;color:#182740;text-decoration:none;border-bottom:1.5px solid #7A9E68">← 초대장으로 돌아가기</a>
  <header>
    <p class="eyebrow">NICE TO MEET YOU</p>
    <h1>2026 연말모임에서<br><em>만날 사람들</em></h1>
    <p class="lede">함께하는 52명 중 미리 보내주신 소개글을 모았어요. 11월 27일 금요일 저녁 7시, 얼굴 보기 전에 한 분씩 먼저 만나보세요.</p>
  </header>

  <div class="tools">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="이름이나 관심사로 찾기 (예: 환경공학, 러닝)" autocomplete="off">
    </label>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <section class="grid" id="grid" aria-label="참가자 소개"></section>
  <p class="empty" id="empty" hidden>찾는 소개글이 없어요. 다른 단어로 찾아보세요.</p>

  <section class="waiting" aria-labelledby="waiting-h">
    <h2 id="waiting-h">소개글은 현장에서 들을게요</h2>
    <p id="waiting-note">함께하는 52명 중 아직 소개글을 보내지 않은 분들이에요.</p>
    <ul class="chips" id="waiting"></ul>
  </section>

  <footer>소개글은 보내주신 그대로 옮겼고, 사진은 보내주신 분만 올렸어요. 카드 순서는 열 때마다 무작위로 바뀌어요.</footer>
</div>

<script>
(() => {
const PEOPLE = [
  { name: '김덕원', alias: '앨지닥터', intro: '안녕하세요, 환경 올라운더이자 환경을 생각하는 사람들 공동대표 앨지닥터입니다.\n\n· 연구: 환경·에너지 논문 14편(SCI(E) 제1저자 포함), 정부·공공 연구과제 9건 참여 / 한양대학교 자원환경공학과 박사과정 수료\n· 정책: 제5기 서울시 환경보건위원회 부위원장, 서울청년정책네트워크 기후·환경 분과위원, 서울시 시민참여예산위원\n· 교육·소통: 기후프레스크 워크숍 25회, 강연 11회 진행 / 한국과학창의재단 과학 커뮤니케이터\n\n미세조류가 이산화탄소를 흡수해 자원이 되는 과정을 연구하다가, 관심이 정책과 교육, 시민의 실천으로 넓어졌어요. 요즘은 1주일에 한 번 기후환경 온라인 무료 교육을 하고 있어요. 이번 모임에서 각자의 관심과 이야기를 편하게 나눌 수 있으면 좋겠어요. 반갑습니다!' },
  { name: '전나훈', intro: '환경공학덕후, 블루스기타리스트, 애처가' },
  { name: '김중동', intro: '안녕하세요. 미생물학을 전공하고 환경 분야에 관심을 갖게 되어, 수처리 오퍼레이터를 거쳐 현재 통합환경인허가 컨설턴트로 근무하고 있는 김중동입니다.\n\n현장에서의 실무 경험과 환경규제 대응 경험을 바탕으로, 향후 ESG 공시 및 지속가능경영 분야까지 전문성을 확장하고자 합니다. 궁극적으로는 기업이 환경적 책임을 다하면서도 경제적 가치를 창출할 수 있도록 돕는 ESG 전문가로 성장하는 것이 목표입니다.' },
  { name: '홍철민', intro: '영상 만드는 일을 하고 있습니다.! 재미있게 영상을만들고 싶어요!' },
  { name: '조현명', intro: '수학을 좋아하는 공대생이에요. 요즘은 파쿠르를 하고 독일어 공부를 하고 있어요. 웃는걸 좋아합니다😁' },
  { name: '유현서', intro: '생태경제학, 포스트성장 등에 관심을 가지고 공부하고 있습니다.' },
  { name: '조재훈', intro: '환경교육 큐레이터를 지향하는 조재훈입니다.\n\n저는 일상 속 다양한 환경문제를 발굴하고 필요한 정보를 선별하며, 상호작용을 기반으로 스스로 생각하고 새로운 관점을 발견하도록 교육을 설계하며, 이를 통해 사람들이 익숙한 일상 속 환경문제를 새롭게 인식하고 탐구할 수 있도록 돕습니다.' },
  { name: '심선희', intro: '안녕하세요. 이화여자대학교 환경공학과 박사과정에 재학 중인 심선희입니다. 현재 하천 수질관리를 중심으로 연구를 수행하고 있으며, 학부부터 박사과정까지 환경공학을 전공하며 환경문제에 대한 관심을 이어오고 있습니다.\n\n전공자의 시각을 넘어 환경에 관심을 가진 다양한 분들의 생각과 의견을 듣고, 서로의 관점을 공유하며 시야를 넓히고 싶습니다.' },
  { name: '한성민', intro: '"데이터로 환경을 진단하고, 시민의 발걸음으로 변화를 만드는 활동가입니다."\n\n안녕하세요. 환경공학 전공을 바탕으로 현재 대기환경 오염물질 측정 업무를 수행하며, 퇴근 후와 주말에는 지역 사회의 지속 가능성을 고민하는 다양한 환경·청년 거버넌스 활동을 이어가고 있는 [한성민]입니다.\n\n평소 산업 현장의 배출시설과 대기 데이터를 직접 측정하며 환경 기준이 현장에서 어떻게 작동하는지 몸소 체감하고 있습니다. 수치로 현장을 진단하는 본업만큼이나, 시민들과 함께 현장에서 부딪히며 변화를 만드는 일에도 큰 보람을 느낍니다.\n\n그동안 인천 지역을 기반으로 청년정책네트워크 기후환경분과 활동, 야구장 일회용품 줄이기 모니터링 캠페인, 줍깅(플로깅) 및 환경 소모임 운영 등 일상 속 자원순환과 탄소중립을 실천하는 자리에 꾸준히 함께해 왔습니다.\n\n저는 복잡한 환경 공학 데이터나 정책 의제를 시민들이 이해하기 쉬운 언어와 콘텐츠로 풀어내는 일에 강점이 있습니다. 앞으로 우리 단체에서도 현장의 실무적 시각과 캠페인·콘텐츠 기획 경험을 보태어, 더 많은 시민이 환경 보호를 즐거운 일상으로 받아들일 수 있도록 힘을 보태겠습니다. 함께 의미 있는 발자국을 만들어가고 싶습니다!' },
  { name: '코코아', alias: '신민아', avatar: '코코아', intro: '안녕하세요! 오전에는 직장인, 밤에는 크리에이터, 새벽에는 비영리단체 단장으로 살아가고 있는 코코아입니다.\n\n저는 대학에서 실용음악, 상담심리학, 경영학을 전공하였고 과거에는 대한민국국가대표선수협회 홍보대사로 활동하며 선한 영향력의 가치를 배웠습니다.\n\n현재는 더 많은 청년들과 함께 따뜻한 변화를 만들고자 청년 봉사 단체 ONDO(온도)를 설립해 단장을 맡고 있으며 @ondo_volunteer 행정안전부 소속 한국사회공헌협회에서 사회적 인플루언서 운영위원이자 쓰레기를 줍고 달리는 PICK & RUN 1.5℃ 캠페인도 총괄하고 있습니다. 비록 작은 걸음일지라도 제가 가진 능력 안에서 세상을 긍정적으로 변화시키고자 끊임없이 노력하고 있습니다.\n\n이렇게 뜻깊은 자리에 초대해 주신 덕원님 진심으로 감사드립니다.' },
  { name: '김현우', intro: '공학석사, 반도체 연구원 이었던 것.' },
  { name: '옥지선', intro: '바이오 생명과학 분야에서 PM직을 맡았고 현재는 이직 준비 중입니다 현재 운동과 영어 공부에 관심을 두고 열심히 하고 있어요' },
  { name: '이정훈', intro: '안녕하세요 건국대학교 사회환경공학부 3학년에 재학중인 이정훈입니다. 현재 건국대학교 중앙환경동아리 CES 부회장으로 활동하고 있으며, 다양한 제로웨이스트, 에너지절감 활동을 통해 캠퍼스를 넘어 지역사회의 환경문제를 개선하기 위해 발로 뛰고 있습니다.\n\n특히, 에너지 절감 문제에 관심이 많아 교내 전력절감플랫폼을 개발 및 운영하며, 모두의 창업 2R 진출 성과를 이루고, 청년이 탄탄한 서울 프로젝트에서 전력절감 및 제로웨이스트 활동을 통해 서울시장상을 2년연속 수상하였습니다.\n\n환경과 토목에 관심이 많은 저로서, 세상을 바꿔나가고 싶은 것이 참으로 많습니다. 여러분과 함께 네트워킹하고, 문제들을 이끌어내면서 그 첫걸음을 함께 해보고 싶습니다. 감사합니다.' },
  { name: '구지민', alias: '구희', intro: '안녕하세요 구희(구지민)입니다. <기후위기인간>이라는 만화를 그리고 출판했어요. 강연도 나가고, 삽화 그리는 일도 하는 프리랜서입니다 :)' },
  { name: '이주호', intro: '고려대학교 환경생태공학과 박사과정생 이주호 입니다. 환경과 조경에 대한 관심을 갖고 있고 중견엔지니어링에서 3년정도 실무를 하다가 올해 초 고려대학교 박사과정으로 입학하게 되었습니다 ㅎㅎ\n\n현재는 그린인프라계획 연구실에서 기후, 탄소, 폭염, 생물다양성과 같은 다양한 R&D와 프로젝트를 수행하고 있습니다. 잘부탁드려요.' },
  { name: '원종준', intro: '지구를 지키는 배움터 대표 원종준입니다.' },
  { name: '김광환', intro: '반도체관련 연구' },
  { name: '김재철', intro: '교육쪽에 관심이 많아서 그쪽 분야 종사중인 사람입니다 취미는 운동, 산책, 맛집 탐방입니당' },
  { name: '낼씨샘', alias: '임정섭', avatar: '낼씨', intro: '생물을 가르치고 있는 낼씨샘입니다. 학생들과 함께 기후변화에 적응하는 식물을 만들고 있습니다. 토종 참외와 서양 멜론을 교배해 만든 ‘기후적응 멜론’은 현재 과학고를 포함한 전국 5개 학교에서 자라고 있습니다.\n\n현재 서울대학교 대학원 석사과정에서 환경 스트레스에 반응하는 식물 뿌리 발달을 연구하고 있습니다.\n\n기후변화에 강한 식물을 학생들과 함께 만들며, 기후위기 시대에 학생들이 직접 할 수 있는 일을 하나씩 찾아가고 싶습니다. 잘 부탁드립니다!' },
  { name: '김민하', intro: '안녕하세요! 김민하입니다. 저는 스스로 성장할 수 있는 상황을 좋아해서 시간을 낭비하지 않고 쓰는걸 좋아해요.\n\n대학생이 된 이후로 줄곧 환경에 관심을 가지고 다양한 활동을 해왔고, 현재는 선릉역 근처에 위치한 환경 컨설팅 회사에 재직하며 온실가스와 자원순환 관련 연구를 수행하고 있습니다.\n\n다양한 이야기 나눌 수 있는 시간이 되었으면 좋겠습니다!' },
  { name: '곽희도', intro: '시대와 사람에 관심 많은 곽희도입니다.' },
  { name: '이유정', intro: '안녕하세요, 저는 고려대학교 보건정책관리학부에 4학년으로 재학 중인 이유정입니다. 보건정책 관련 국책연구기관에서 일하는 것을 목표로 학석사연계 과정 중에 있고, 특히 주거 취약계층, 사회적 고립, 사회적 자본에 관심을 두고 공부하고 있습니다.\n\n쪽방촌 주민분들을 대상으로 봉사를 기획했던 쪽방지기 팀에서 활동했으며, 현재는 해비타트 소속 집 고치기 동아리 \'고집\'에서 임원진으로 활동중입니다:)\n\n새로운 사람들을 만나고 생각을 나누는 것을 좋아해서 이번 모임이 무척 기대하고 있습니다! 잘 부탁드립니다😊' },
  { name: '박동영', intro: '"기후위기로 죽어가는 지구를 살리는 지구 전담 의사가 되고 싶어요"\n\n안녕하세요, 국내 대학 중 유일하게 기후변화 전공을 보유한 한국외국어대학교 기후변화융합학부에 재학 중인 "지구 전문의(Earth Doctor)" 지망생 박동영입니다. 현재 대한민국 기상청(KMA)과 재단법인 기후변화센터, 해양환경공단(KOEM)에서 대국민 기자단으로 활동하고 있으며 기상 및 기후, 환경에 대한 과학적 전문 지식을 국민들에게 쉬운 언어로 전달하는 업무를 맡고 있습니다.\n\n올해 학부 2학년을 마치고 대한민국 공군(ROK AF)에서 복무한 후, 학부 3학년부터는 전담 교수님과 함께 본격적인 기상 및 기후 연구에 돌입할 예정입니다. 과학적인 연구 결과가 실제 온실가스 감축 계획에 반영될 수 있도록 입법 및 행정기관을 향한 정책 제안 활동도 이어나갈 것입니다.\n\n기후위기를 과학적인 관점에서 연구하는 것을 넘어 우리 사회의 고질적인 불평등 문제와도 연계지어 지속 가능한 해결책을 마련하기 위해 최선을 다하겠습니다.' },
  { name: '박다한', intro: '“숫자로 사람들의 목소리를 읽고, 정치가 그 목소리에 응답할 수 있도록 메시지와 전략을 고민합니다.”\n\n안녕하세요. 한국사회여론연구소(KSOI)에서 여론조사와 정치컨설팅을 하는 박다한입니다. 홈스쿨링과 검정고시를 거쳐 대학 시절에는 학생운동을 하며 정치와 사회에 대한 관심을 키워왔습니다. 오랫동안 품어온 관심이 자연스럽게 지금의 직업으로 이어졌으니, 어쩌면 저는 덕질 중인지도모릅니다. ^^\n\n지금은 사람들의 목소리를 듣고, 정치가 그 목소리에 어떻게 응답할 수 있을지 고민하는 일을 하고 있습니다. 여론조사로 민심의 흐름을 살피고, 정치컨설팅을 통해 정치인들의 이미지와 메시지, 유권자와의 소통 전략을 고민합니다. 사람들의 생각이 숫자로 드러나는 순간도 흥미롭지만, 그 숫자가 정치적 판단과 전략으로 이어지는 과정을 설계하고 지켜보고 참여할 수 있다는 점이 이 일의 가장 큰 매력입니다.\n\n환경에 대해서도 종종 생각합니다. 작년 연말파티였던가요? 선거 현수막에 관한 이야기를 나눴던 기억이 납니다. 선거와 관련된 일을 하는 저 역시 선거철마다 거리 곳곳에 걸리는 현수막을 보면서, 선거가 끝나면 저 많은 것들이 다 어디로 갈까, 마음에 걸립니다. 현수막뿐 아니라 각종 인쇄 홍보물과 일회성 선거용품도 마찬가지고요. 선거운동의 자유를 보장하면서도 환경에 미치는 부담을 줄일 수 있는 방법이 더 많아졌으면 좋겠습니다. 관련 제도와 선거문화도 조금씩 달라지면 좋겠고요.\n\n앞으로는 여론조사와 정치컨설팅을 넘어 더 다양한 영역에서 우리 사회의 문제를 고민하고 해결하는 데 힘을 보태고 싶습니다. 어떤 자리에 있든 사람들의 삶과 동떨어지지 않은 일을 하고 싶어요.\n\n평소 새로운 이야기를 듣고 새로운 것을 알아가는 것을 좋아합니다. 진지한 대화도 일상의 소소한 이야기도 좋습니다. 이번 모임에서도 서로의 관심사와 살아온 이야기 편하게 나눌 수 있으면 좋겠습니다. 반갑습니다!' },
];
// everyone else on the confirmed participant list (52 people), in the list's order
const WAITING = ['이동호', '김소윤', '정원석', '장우진', '조용준', '하지은', '한준규',
  '이우일', '송인하', '이재은', '차효일', '신동빈', '이나연', '성무준', '김민건', '정동영', '김가영', '이주렬', '남예지',
  '한창기', '황혜진', '정진', '김현태', '이효선', '소현호', '김현우', '박진영'];
const TOTAL = 52;   // confirmed participants (one guest is intentionally not listed by name)
// photos sent with the survey (only people who attached one), shrunk to 480px wide
const PHOTOS = {
  '김덕원': ['algae', 480], '조현명': ['johm', 640], '조재훈': ['jojh', 535], '심선희': ['simsh', 341], '한성민': ['hansm', 640], '코코아': ['cocoa', 640],
  '김현우': ['kimhw', 320], '김광환': ['kimkh', 640], '낼씨샘': ['limjs', 360], '김민하': ['kimmh', 640], '곽희도': ['kwakhd', 324], '박다한': ['parkdh', 480], '이유정': ['leeyj', 640], '박동영': ['parkdy', 640], '이정훈': ['leejh', 571], '구지민': ['gujm', 500], '이주호': ['leejuho', 347],
};

const TINTS = ['var(--sage-soft)', 'var(--peach)', 'var(--sky)', 'var(--butter)', 'var(--rose)'];
const grid = document.getElementById('grid'), q = document.getElementById('q'),
  count = document.getElementById('count'), empty = document.getElementById('empty');

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = html => html.replace(/(?:https?:\/\/)?(www\.linkedin\.com\/in\/[\w-]+)/g, (m, u) => `<a href="https://${u}" target="_blank" rel="noopener">${u}</a>`);
function highlight(html, term) {
  if (!term) return html;
  const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return html.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, text) => tag || text.replace(new RegExp(t, 'gi'), x => `<mark>${x}</mark>`));
}

// host stays first; everyone else gets a fresh random order on every visit
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ORDER = [PEOPLE[0], ...shuffle(PEOPLE.slice(1))];
const cards = ORDER.map((p, i) => {
  const el = document.createElement('article');
  el.className = 'card' + (p.intro.length > 230 ? ' long' : '');
  const av = p.avatar || (p.name.length >= 3 ? p.name.slice(1) : p.name);
  const ph = PHOTOS[p.name];
  el.innerHTML = `
    ${ph ? `<img class="photo" src="photos/${ph[0]}.jpg" width="480" height="${ph[1]}" alt="${esc(p.name)} 님이 보내준 사진" loading="lazy">` : ''}
    <div class="who">
      ${ph ? '' : `<span class="avatar" style="background:${TINTS[i % TINTS.length]}" aria-hidden="true">${esc(av)}</span>`}
      <h2 class="name">${esc(p.name)}${p.alias ? `<span class="alias">${esc(p.alias)}</span>` : ''}</h2>
    </div>
    <p class="intro"></p>
    ${p.intro.length > 230 ? '<button class="more" type="button" aria-expanded="false">더 보기</button>' : ''}`;
  const intro = el.querySelector('.intro');
  const base = linkify(esc(p.intro));
  const btn = el.querySelector('.more');
  if (btn) btn.addEventListener('click', () => {
    const open = el.classList.toggle('open');
    btn.textContent = open ? '접기' : '더 보기';
    btn.setAttribute('aria-expanded', String(open));
  });
  grid.appendChild(el);
  return { el, intro, base, hay: (p.name + ' ' + (p.alias || '') + ' ' + p.intro).toLowerCase() };
});

function apply() {
  const term = q.value.trim();
  const t = term.toLowerCase();
  let shown = 0;
  for (const c of cards) {
    const hit = !t || c.hay.includes(t);
    c.el.hidden = !hit;
    c.intro.innerHTML = highlight(c.base, term);
    if (hit) shown++;
  }
  grid.classList.toggle('searching', !!t);
  count.textContent = t ? `소개글 ${PEOPLE.length}개 중 ${shown}개` : `참가자 ${TOTAL}명 · 소개글 ${PEOPLE.length}명`;
  empty.hidden = shown > 0;
}
q.addEventListener('input', apply);
apply();

document.getElementById('waiting').innerHTML = WAITING.map(n => `<li>${esc(n)}</li>`).join('');
document.getElementById('waiting-note').textContent = `함께하는 ${TOTAL}명 중 아직 소개글을 보내지 않은 분들이에요.`;
})();
</script>
